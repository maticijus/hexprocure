services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hexprocure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hexprocure}
      POSTGRES_DB: ${POSTGRES_DB:-hexprocure}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hexprocure} -d ${POSTGRES_DB:-hexprocure}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ocr:
    build: ./services/ocr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  migrate:
    build: .
    command: ["node", "scripts/migrate.mjs"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hexprocure}:${POSTGRES_PASSWORD:-hexprocure}@db:5432/${POSTGRES_DB:-hexprocure}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hexprocure}:${POSTGRES_PASSWORD:-hexprocure}@db:5432/${POSTGRES_DB:-hexprocure}
      INTEGRATION_OCR_URL: http://ocr:8100
    volumes:
      - uploads:/app/.data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      ocr:
        condition: service_started

volumes:
  pgdata:
  uploads:
